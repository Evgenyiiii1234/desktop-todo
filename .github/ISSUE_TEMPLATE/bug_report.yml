name: Bug report
description: 报告一个问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量填完整，尤其是复现步骤和系统版本。
  - type: input
    id: version
    attributes:
      label: 程序版本
      description: 在 `⋯` 菜单或 Release 页面可以看到，例如 v0.3.0
      placeholder: v0.3.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows 版本
      placeholder: Windows 11 23H2 / Windows 10 22H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开程序
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 截图或补充信息
      description: 可直接把图片拖进来
    validations:
      required: false
